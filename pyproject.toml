[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlens"
version = "0.1.0"
description = "Local language identification + robust transcription (faster-whisper) with an explicit anti-hallucination harness"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "faster-whisper>=1.0,<2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
denoise = ["noisereduce>=3.0"]
# Speaker enrol/identify/verify with a pretrained ECAPA-TDNN. Pulls in torch, so
# it is opt-in: the core install keeps its no-torch ceiling.
speaker = ["speechbrain>=1.0", "torch>=2.0"]

[project.scripts]
speechlens = "speechlens.cli:main"

[tool.setuptools.packages.find]
include = ["speechlens*"]

[tool.setuptools.package-data]
speechlens = ["static/*.html", "policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
