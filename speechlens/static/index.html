<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeechLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink-950:#151021; --panel:#1e1733; --panel-2:#271e40; --line:#3a2d5c;
  --text:#ece6f4; --muted:#9c90bd; --err:#c73e4b;
  --mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Chakra Petch",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink-950);color:var(--text);
  font-family:var(--mono);font-size:14px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 72px}
header{display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:22px}
.wordmark{font-family:var(--disp);font-weight:600;font-size:26px;
  letter-spacing:.06em}
.wordmark em{font-style:normal;color:var(--muted);font-weight:500}
#status{font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:4px 12px}
.eyebrow{font-family:var(--disp);font-weight:500;font-size:12px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  margin:30px 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:18px}
/* input deck: waveform-ruler texture */
#deck{position:relative;padding:30px 22px;text-align:center;
  background-image:repeating-linear-gradient(90deg,
    var(--line) 0 1px, transparent 1px 12px);
  background-size:100% 14px;background-position:bottom;
  background-repeat:no-repeat}
#deck.drag{border-color:#b73779;background-color:var(--panel-2)}
#deck p{margin:0 0 16px;color:var(--muted)}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;
  flex-wrap:wrap}
button{font-family:var(--mono);font-size:14px;font-weight:500;cursor:pointer;
  color:var(--text);background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:9px 18px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid #f1605d;
  outline-offset:2px}
button.rec.on{background:var(--err);border-color:var(--err);color:#fff}
@media (prefers-reduced-motion:no-preference){
  button.rec.on{animation:pulse 1.2s ease-in-out infinite}
  .meter i{transition:width .7s ease}
}
@keyframes pulse{50%{opacity:.65}}
input[type=text]{font-family:var(--mono);font-size:13px;width:64px;
  color:var(--text);background:var(--ink-950);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;text-align:center}
label{font-size:12px;color:var(--muted)}
#busy{display:none;margin-top:14px;color:var(--muted);font-size:13px}
#busy.on{display:block}
#error{display:none;margin-top:14px;color:var(--err);font-size:13px}
#results{display:none}
/* language panel */
.langrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#langName{font-family:var(--disp);font-weight:600;font-size:34px;
  line-height:1.1}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;
  padding:2px 8px;color:var(--muted)}
.meter{height:14px;border-radius:7px;background:var(--ink-950);
  border:1px solid var(--line);overflow:hidden;margin:14px 0 6px}
.meter i{display:block;height:100%;width:0}
.meterlabel{display:flex;justify-content:space-between;font-size:12px;
  color:var(--muted)}
.alts{margin-top:12px;font-size:13px;color:var(--muted)}
.alts b{color:var(--text);font-weight:500}
/* transcript */
.seg{display:grid;grid-template-columns:150px 64px 1fr;gap:12px;
  padding:10px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.seg:last-child{border-bottom:none}
.seg .ts{color:var(--muted);font-size:12px;white-space:nowrap}
.conf{font-size:12px;font-weight:600;text-align:center;border-radius:6px;
  padding:2px 0}
.seg .txt{font-size:15px}
.seg.flagged .txt::after{content:" ⚠";color:#feae77}
/* stats + warnings */
#stats{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:12px;
  color:var(--muted)}
#stats b{color:var(--text);font-weight:500}
#warnings{display:none;border-color:#8a5a2b;color:#feae77;font-size:13px}
#warnings div+div{margin-top:6px}
@media(max-width:560px){.seg{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">SPEECHLENS <em>/ local audio analysis</em></div>
    <div id="status">connecting…</div>
  </header>

  <div class="panel" id="deck">
    <p>Drop an audio file — wav, mp3, m4a, flac, webm — or record a clip.
       Everything runs on this machine.</p>
    <div class="controls">
      <button id="pick">Analyze a file</button>
      <button id="rec" class="rec">Record</button>
      <label for="lang">force lang</label>
      <input id="lang" type="text" placeholder="auto" maxlength="3"
             spellcheck="false">
    </div>
    <input id="file" type="file" accept="audio/*,video/webm" hidden>
    <div id="busy">analyzing — first run downloads model weights, then loads
      them onto the GPU…</div>
    <div id="error"></div>
  </div>

  <div id="results">
    <div class="eyebrow">Language</div>
    <div class="panel">
      <div class="langrow">
        <span id="langName"></span>
        <span class="chip" id="langCode"></span>
        <span class="chip" id="langMethod"></span>
      </div>
      <div class="meter"><i id="langMeter"></i></div>
      <div class="meterlabel"><span>P(language | audio)</span>
        <span id="langProb"></span></div>
      <div class="alts" id="alts"></div>
    </div>

    <div class="eyebrow">Transcript</div>
    <div class="panel" id="segments"></div>

    <div class="eyebrow">Run</div>
    <div class="panel" id="stats"></div>

    <div class="panel" id="warnings" style="margin-top:14px"></div>
  </div>
</div>

<script>
// --- magma colormap: the page's confidence encoding ------------------------
const MAGMA = [[0.00,[44,17,95]],[0.25,[114,31,129]],[0.50,[183,55,121]],
               [0.75,[241,96,93]],[0.90,[254,174,119]],[1.00,[252,253,191]]];
function magma(t){
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < MAGMA.length; i++){
    if (t <= MAGMA[i][0]){
      const [t0,c0] = MAGMA[i-1], [t1,c1] = MAGMA[i];
      const k = (t - t0) / (t1 - t0);
      const rgb = c0.map((v,j) => Math.round(v + k*(c1[j]-v)));
      return {css:`rgb(${rgb})`,
              text: (0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]) > 150
                    ? "#151021" : "#ece6f4"};
    }
  }
}

const $ = id => document.getElementById(id);
const deck = $("deck"), fileInput = $("file");

// --- health ----------------------------------------------------------------
fetch("/api/health").then(r => r.json())
  .then(h => $("status").textContent = `model ${h.model} · ${h.device}`)
  .catch(() => $("status").textContent = "server unreachable");

// --- input: file pick + drag-drop -------------------------------------------
$("pick").onclick = () => fileInput.click();
fileInput.onchange = () => {
  if (fileInput.files[0]) analyze(fileInput.files[0], fileInput.files[0].name);
};
["dragover","dragenter"].forEach(ev => deck.addEventListener(ev, e => {
  e.preventDefault(); deck.classList.add("drag"); }));
["dragleave","drop"].forEach(ev => deck.addEventListener(ev, e => {
  e.preventDefault(); deck.classList.remove("drag"); }));
deck.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0];
  if (f) analyze(f, f.name);
});

// --- input: microphone -------------------------------------------------------
let recorder = null, chunks = [];
$("rec").onclick = async () => {
  if (recorder && recorder.state === "recording"){ recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      $("rec").textContent = "Record"; $("rec").classList.remove("on");
      analyze(new Blob(chunks, {type: recorder.mimeType}), "recording.webm");
    };
    recorder.start();
    $("rec").textContent = "Stop"; $("rec").classList.add("on");
  } catch (err){ showError("Microphone unavailable: " + err.message); }
};

// --- analyze ------------------------------------------------------------------
async function analyze(blob, name){
  $("error").style.display = "none";
  $("busy").classList.add("on");
  const fd = new FormData();
  fd.append("file", blob, name);
  const lang = $("lang").value.trim();
  if (lang) fd.append("language", lang);
  try {
    const res = await fetch("/api/analyze", {method:"POST", body:fd});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    render(data);
  } catch (err){ showError(err.message); }
  finally { $("busy").classList.remove("on"); }
}

function showError(msg){
  const e = $("error");
  e.textContent = msg + " — supported inputs: wav, mp3, m4a, flac, webm.";
  e.style.display = "block";
}

// --- render --------------------------------------------------------------------
function render(d){
  $("results").style.display = "block";

  const L = d.language, p = L.probability;
  $("langName").textContent = L.name;
  $("langCode").textContent = L.code;
  $("langMethod").textContent = L.method === "forced"
    ? "forced" : `chunk vote ×${L.chunks_used}`;
  $("langProb").textContent = "p = " + p.toFixed(3) +
    (L.entropy ? `   H = ${L.entropy.toFixed(2)} nats` : "");
  const m = $("langMeter");
  m.style.width = "0"; m.style.background = magma(p).css;
  requestAnimationFrame(() => m.style.width = (100*p).toFixed(1) + "%");
  $("alts").innerHTML = (L.top || []).slice(1).length
    ? "alternates · " + L.top.slice(1).map(([c,q]) =>
        `<b>${c}</b> ${q.toFixed(3)}`).join(" · ")
    : "";

  const segs = $("segments");
  segs.innerHTML = "";
  if (!d.transcript.segments.length)
    segs.innerHTML = "<span style='color:var(--muted)'>No speech decoded." +
                     "</span>";
  for (const s of d.transcript.segments){
    const c = magma(s.confidence);
    const row = document.createElement("div");
    row.className = "seg" + (s.flagged ? " flagged" : "");
    row.innerHTML =
      `<span class="ts">${fmt(s.start)} → ${fmt(s.end)}</span>` +
      `<span class="conf" style="background:${c.css};color:${c.text}"` +
      ` title="avg logprob ${s.avg_logprob}">${s.confidence.toFixed(2)}` +
      `</span><span class="txt"></span>`;
    row.querySelector(".txt").textContent = s.text;
    segs.appendChild(row);
  }

  const A = d.audio, P = d.performance;
  $("stats").innerHTML =
    `<span>duration <b>${A.duration_s}s</b></span>` +
    `<span>speech <b>${Math.round(100*A.speech_ratio)}%</b></span>` +
    `<span>vad <b>${A.vad_backend}</b></span>` +
    `<span>model <b>${P.model}</b></span>` +
    `<span>device <b>${P.device}/${P.compute_type}</b></span>` +
    `<span>rtf <b>${P.rtf}</b></span>` +
    `<span>flagged <b>${d.transcript.flagged_segments}</b></span>`;

  const W = $("warnings");
  W.style.display = d.warnings.length ? "block" : "none";
  W.innerHTML = d.warnings.map(w => `<div>! ${esc(w)}</div>`).join("");
}

const fmt = t => {
  const m = Math.floor(t/60), s = (t - 60*m).toFixed(1).padStart(4,"0");
  return `${String(m).padStart(2,"0")}:${s}`;
};
const esc = s => s.replace(/[&<>]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
</script>
</body>
</html>
