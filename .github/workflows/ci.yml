name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Required by tests/test_silero.py (which auto-skips without it) and by
      # the smoke study in scripts/validate.py.
      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install package
        run: pip install -e ".[dev]"

      # The offline-test invariant: no network, no model weights, forever.
      # HF_HUB_OFFLINE makes a violation fail loudly here rather than silently
      # downloading 3 GB on someone's laptop later.
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q
